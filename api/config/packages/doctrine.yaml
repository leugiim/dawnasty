doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            # Cada módulo de Domain/ registra su propio mapping XML, ubicado en
            # <Modulo>/Infrastructure/Doctrine/Mapping/ (docs/architecture.md,
            # sección 4.1). El "prefix" es el namespace del Domain/ del módulo,
            # para que "Player.orm.xml" resuelva a la clase App\Player\Domain\Player.
            Player:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Player/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Player\Domain'
                alias: Player
            Village:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Village/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Village\Domain'
                alias: Village

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
